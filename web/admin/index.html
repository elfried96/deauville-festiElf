<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Festival du Rire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div class="wrap">
        <div class="admin-brand">
          <svg class="mark" viewBox="0 0 32 40" aria-hidden="true">
          <path d="M16 16H3a13 13 0 0 1 6.5-11.26z" fill="#e8643c" />
          <path d="M16 16L9.5 4.74a13 13 0 0 1 13 0z" fill="currentColor" />
          <path d="M16 16l6.5-11.26A13 13 0 0 1 29 16z" fill="#e8643c" />
          <rect x="11" y="16" width="10" height="5" rx="2.5" fill="currentColor" />
          <rect x="14" y="20" width="4" height="18" rx="2" fill="currentColor" />
        </svg>
          <strong>Festival du Rire</strong>
          <span class="muted">Admin</span>
        </div>
        <nav class="nav" aria-label="Admin">
          <a href="/">View website</a>
          <a href="/docs">API docs</a>
        </nav>
      </div>
    </header>

    <main class="wrap admin-main">
      <div class="section-head">
        <div>
          <h1 class="admin-title">Schedule</h1>
          <p class="admin-lead" id="lead">
            Every change is checked by the server and saved at once.
          </p>
        </div>
        <button type="button" class="button" id="new-performance">
          New performance
        </button>
      </div>

      <div id="message" aria-live="polite"></div>

      <div class="admin-columns">
        <section class="schedule" aria-label="Performances">
          <div class="admin-tabs" id="days" role="group" aria-label="Festival day"></div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Time</th>
                  <th scope="col">Performance</th>
                  <th scope="col">Venue</th>
                  <th scope="col">Type</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>

        <div class="side">
          <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">New performance</h2>
            <p class="hint" id="form-hint">
              Every rule is checked by the server before saving.
            </p>

            <form id="performance-form">
              <fieldset>
                <legend>Type</legend>
                <div class="segmented">
                  <input type="radio" name="kind" id="kind-solo" value="solo" checked />
                  <label for="kind-solo">Solo</label>
                  <input type="radio" name="kind" id="kind-lineup" value="lineup" />
                  <label for="kind-lineup">Lineup</label>
                  <input type="radio" name="kind" id="kind-workshop" value="workshop" />
                  <label for="kind-workshop">Workshop</label>
                </div>
              </fieldset>

              <label class="field">Title <input name="title" required /></label>
              <div class="two">
                <label class="field"
                  >Venue <select name="venue" class="venue-select"></select
                ></label>
                <label class="field"
                  >Duration (min)
                  <input name="duration_minutes" type="number" min="1" required
                /></label>
              </div>
              <label class="field"
                >Start <input name="start" type="datetime-local" required
              /></label>

              <fieldset data-kind="solo" class="kind-fields">
                <div class="two">
                  <label class="field"
                    >Artist <select name="artist" class="artist-select"></select
                  ></label>
                  <label class="field"
                    >Minimum age
                    <input name="min_age" type="number" min="0" max="18" value="0"
                  /></label>
                </div>
              </fieldset>

              <fieldset data-kind="lineup" class="kind-fields">
                <label class="field"
                  >Host <select name="host" class="artist-select"></select
                ></label>
                <fieldset>
                  <legend>Acts, in running order (at least two)</legend>
                  <div id="acts" class="checks"></div>
                </fieldset>
              </fieldset>

              <fieldset data-kind="workshop" class="kind-fields">
                <div class="two">
                  <label class="field"
                    >Teacher <select name="teacher" class="artist-select"></select
                  ></label>
                  <label class="field"
                    >Places
                    <input name="max_participants" type="number" min="1" value="12"
                  /></label>
                </div>
              </fieldset>

              <label class="field"
                >Description <textarea name="description" rows="2"></textarea
              ></label>

              <div class="actions">
                <button type="submit" class="button" id="submit">Schedule</button>
                <button type="button" class="button outline" id="cancel-edit" hidden>
                  Cancel edit
                </button>
              </div>
            </form>
          </section>

          <section class="panel" aria-labelledby="artist-title">
            <h2 id="artist-title">New artist</h2>
            <form id="artist-form">
              <label class="field">Name <input name="name" required /></label>
              <label class="field">Bio <input name="bio" /></label>
              <label class="field"
                >Photo URL <input name="photo_url" type="url"
              /></label>
              <div class="actions">
                <button type="submit" class="button">Add artist</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script src="/admin/admin.js"></script>
  </body>
</html>
