<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deauville Festival du Rire</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap">
        <p class="eyebrow">First edition</p>
        <h1>Deauville Festival <span>du Rire</span></h1>
        <p class="dates" id="dates"></p>
        <nav class="nav">
          <a href="#programme">Programme</a>
          <a href="#artists">Artists</a>
          <a href="/admin/">Admin</a>
          <a href="/docs">API</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section id="now-section">
        <div class="now" id="now"></div>
      </section>

      <section id="programme">
        <h2>Programme</h2>
        <div class="toolbar" id="days"></div>
        <div class="toolbar">
          <span class="muted" id="count"></span>
          <select id="venue-filter" aria-label="Venue">
            <option value="">All venues</option>
          </select>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <section id="artists">
        <h2>Artists</h2>
        <div class="artist-grid" id="artist-grid"></div>
      </section>
    </main>

    <footer class="wrap">
      A festival day runs until 06:00: late-night shows belong to the evening
      before.
    </footer>

    <script src="/app.js"></script>
    <script>
      showHomePage();
    </script>
  </body>
</html>
