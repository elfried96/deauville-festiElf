<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artist — Festival du Rire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="wrap site-header">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 32 40" aria-hidden="true">
          <path d="M16 16H3a13 13 0 0 1 6.5-11.26z" fill="#e8643c" />
          <path d="M16 16L9.5 4.74a13 13 0 0 1 13 0z" fill="currentColor" />
          <path d="M16 16l6.5-11.26A13 13 0 0 1 29 16z" fill="#e8643c" />
          <rect x="11" y="16" width="10" height="5" rx="2.5" fill="currentColor" />
          <rect x="14" y="20" width="4" height="18" rx="2" fill="currentColor" />
        </svg>
        <span class="brand-name"><strong>Festival du Rire</strong><span>Deauville 2027</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/#programme">Programme</a>
        <a href="/#artists" aria-current="page">Artists</a>
        <a href="/#venues">Venues</a>
        <a class="button" href="/#programme">See the programme</a>
      </nav>
    </header>

    <main class="wrap">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/#artists">Artists</a> <span aria-hidden="true">/</span>
        <span aria-current="page" id="crumb"></span>
      </nav>

      <div class="artist">
        <div class="photo" id="portrait"></div>
        <div class="artist-body">
          <h1 id="artist-name">Artist</h1>
          <p class="artist-bio" id="bio"></p>
          <dl class="facts" id="facts"></dl>
          <h2 class="sub-title">On stage</h2>
          <ol class="rows" id="shows"></ol>
        </div>
      </div>

      <section class="section" aria-labelledby="with-title" id="with-section">
        <div class="section-head">
          <h2 class="section-title" id="with-title">On stage together</h2>
          <a href="/#artists">All artists</a>
        </div>
        <div class="grid" id="with-grid"></div>
      </section>
    </main>

    <footer class="wrap site-footer">
      <div class="footer-line">
        <span>Festival du Rire · Deauville</span>
        <span><a href="/admin/">Organisers</a> · <a href="/docs">API</a></span>
      </div>
    </footer>

    <script src="/app.js"></script>
    <script>
      showArtistPage();
    </script>
  </body>
</html>
